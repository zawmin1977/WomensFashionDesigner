
name: Build Women's Fashion Designer APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -q WomensFashionDesigner-Source.zip -d source

      - name: Build APK
        working-directory: source/WomensFashionDesigner
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WomensFashionDesigner-APK
          path: source/WomensFashionDesigner/app/build/outputs/apk/debug/app-debug.apk
